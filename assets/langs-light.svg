<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="Language mix across public repositories: Python 51.16%, JavaScript 28.28%, TypeScript 18.33%, CSS 1.08%, HTML 0.71%, PowerShell 0.34%, Batchfile 0.12%">
